# Loki for the Lab 4 stack (#154): single process, local filesystem storage in the loki-data volume.
# Grafana Alloy pushes every container's JSON log lines here; Grafana's logs panels and the
# downloadable-logs endpoint (#155) query it at http://loki:3100.
auth_enabled: false

server:
  http_listen_port: 3100
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2026-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # Logs older than a week are dropped; the demo stack never needs more.
  retention_period: 168h
  allow_structured_metadata: true
  reject_old_samples: false

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
