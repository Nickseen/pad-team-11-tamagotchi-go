# Optional Lab 5 hierarchy for Monster Raid PostgreSQL and Map Redis (#193).
# Use together with docker-compose.yml. No database ports are published.
x-postgres-node: &postgres-node
  image: postgres:17-alpine
  restart: unless-stopped
  entrypoint: ["/bin/sh", "/lab5-ha/postgres-start.sh"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    interval: 3s
    timeout: 2s
    retries: 20

x-raid-db-env: &raid-db-env
  POSTGRES_DB: raid
  POSTGRES_USER: raid
  POSTGRES_PASSWORD: ${RAID_DB_PASSWORD:?set RAID_DB_PASSWORD in .env}
  PG_REPLICATION_PASSWORD: ${LAB5_RAID_REPLICATION_PASSWORD:?set LAB5_RAID_REPLICATION_PASSWORD in .env}

x-raid-standby: &raid-standby
  <<: *postgres-node
  environment:
    <<: *raid-db-env
    PGDATA: /var/lib/postgresql/data/pgdata
    PG_REPLICA_SOURCE: monster-raid-db
  depends_on:
    monster-raid-replication-init:
      condition: service_completed_successfully

x-raid-ha-env: &raid-ha-env
  DATABASE_URL: postgres://raid:${RAID_DB_PASSWORD}@monster-raid-db:5432,monster-raid-db-1:5432,monster-raid-db-2:5432/raid?sslmode=disable&target_session_attrs=read-write&connect_timeout=2

x-raid-ha-deps: &raid-ha-deps
  message-broker:
    condition: service_healthy
  monster-raid-redis:
    condition: service_healthy

x-map-ha-env: &map-ha-env
  MAP_REDIS_ADDR: map-redis-writer:6379

x-map-ha-deps: &map-ha-deps
  message-broker:
    condition: service_healthy
  map-redis-writer:
    condition: service_started

x-map-redis-node: &map-redis-node
  image: redis:7.4-alpine
  restart: unless-stopped
  entrypoint: ["/bin/sh", "/lab5-ha/redis-start.sh"]
  environment:
    MAP_REDIS_PASSWORD: ${MAP_REDIS_PASSWORD:?set MAP_REDIS_PASSWORD in .env}
    REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}

x-map-replica: &map-replica
  <<: *map-redis-node
  command: ["replica"]
  depends_on:
    map-redis:
      condition: service_started

x-map-sentinel: &map-sentinel
  <<: *map-redis-node
  command: ["sentinel"]
  depends_on:
    map-redis:
      condition: service_started

services:
  monster-raid-db:
    <<: *postgres-node
    hostname: monster-raid-db
    environment:
      <<: *raid-db-env
      PGDATA: ${LAB5_RAID_ORIGINAL_DATA_DIR:-/var/lib/postgresql/data}
      PG_REPLICA_SOURCE: ${LAB5_RAID_REJOIN_SOURCE:-}
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
      - ${LAB5_RAID_ORIGINAL_VOLUME:-raid-data}:/var/lib/postgresql/data

  monster-raid-replication-init:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/lab5-ha/postgres-init-role.sh"]
    environment:
      <<: *raid-db-env
      PGHOST: monster-raid-db
      PGCONNECT_TIMEOUT: 3
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
    depends_on:
      monster-raid-db:
        condition: service_healthy

  monster-raid-db-1:
    <<: *raid-standby
    hostname: monster-raid-db-1
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
      - raid-db-1-data:/var/lib/postgresql/data

  monster-raid-db-2:
    <<: *raid-standby
    hostname: monster-raid-db-2
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
      - raid-db-2-data:/var/lib/postgresql/data

  monster-raid-1:
    environment: *raid-ha-env
    depends_on: !override
      <<: *raid-ha-deps

  monster-raid-2:
    environment: *raid-ha-env
    depends_on: !override
      <<: *raid-ha-deps

  monster-raid-3:
    environment: *raid-ha-env
    depends_on: !override
      <<: *raid-ha-deps

  map-redis:
    <<: *map-redis-node
    hostname: map-redis
    command: ["primary"]
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
      - map-redis-data:/data

  map-redis-1:
    <<: *map-replica
    hostname: map-redis-1
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
      - map-redis-1-data:/data

  map-redis-2:
    <<: *map-replica
    hostname: map-redis-2
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
      - map-redis-2-data:/data

  map-sentinel-1:
    <<: *map-sentinel
    hostname: map-sentinel-1
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
      - map-sentinel-1-data:/data

  map-sentinel-2:
    <<: *map-sentinel
    hostname: map-sentinel-2
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
      - map-sentinel-2-data:/data

  map-sentinel-3:
    <<: *map-sentinel
    hostname: map-sentinel-3
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
      - map-sentinel-3-data:/data

  map-redis-writer:
    image: haproxy:3.2-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/lab5-ha/redis-writer.sh"]
    environment:
      MAP_REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
    volumes:
      - ./scripts/lab5/ha:/lab5-ha:ro
    depends_on:
      - map-redis-1
      - map-redis-2
      - map-sentinel-1
      - map-sentinel-2
      - map-sentinel-3

  map-1:
    environment: *map-ha-env
    depends_on: !override
      <<: *map-ha-deps

  map-2:
    environment: *map-ha-env
    depends_on: !override
      <<: *map-ha-deps

  map-3:
    environment: *map-ha-env
    depends_on: !override
      <<: *map-ha-deps

volumes:
  raid-db-1-data:
  raid-db-2-data:
  raid-rejoined-data:
  map-redis-1-data:
  map-redis-2-data:
  map-sentinel-1-data:
  map-sentinel-2-data:
  map-sentinel-3-data:
