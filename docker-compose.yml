# The whole Tamagotchi Go ecosystem for Lab 3: the API Gateway, Service Discovery, two replicas of
# each of the eight services and the stores each service owns, run from versioned images. Nothing
# is built locally. DRAFT for #133: it selects the planned Lab 3 releases; README ("Lab 3 rollout
# status") lists which are published. Do not merge until every image exists and the shared-stack
# checks in #133 pass.
#
#   cp .env.example .env                                   # replace every CHANGE_ME
#   openssl genrsa -out secrets/jwt-signing-key.pem 2048   # one key for every User Management replica
#   chmod 644 secrets/jwt-signing-key.pem                  # the distroless image runs as non-root
#   docker compose up -d                                   # two replicas of every service
#   docker compose up -d --scale battle=3                  # the five deploy.replicas services, up to 5
#   docker compose --profile scale-map up -d               # Map, Guild, Raid: their -3 block; scale-all adds every -3
#
# Lab 4 (#154): the Message Broker carries service-to-service calls and events
# (docs/lab4-broker-contract.md); Prometheus, Loki, Alloy and Grafana (http://localhost:3000)
# monitor the Lab 4 components. Every application image is a published 4.x release pinned
# to its actual main commit. Demo scripts for Grades 9-10 are in scripts/lab4.
#
# Clients reach the system only through the Gateway on localhost:8080, as /<service>/api/v1/...;
# Lab 4 service calls go through the Broker, which selects replicas by load and owns their breakers.
# Run scripts/verify-lab4.mjs before demos; release adoption is not a full-stack acceptance receipt.
# Map, Guild and Monster Raid replicas also publish one host port each (map-1 18085, map-2 28085,
# map-3 38085, likewise 1808x/2808x/3808x for Guild and Raid), because clients open their
# WebSockets directly to the replica named in their Gateway ticket. Broker diagnostics are on
# 127.0.0.1:8091; Grafana/Prometheus use 3000/9090. SD, stores and domain gRPC stay private.
#
# Every replica registers its own INSTANCE_BASE_URL (and INSTANCE_WS_PUBLIC_URL) with Discovery,
# which accepts only the origins in DISCOVERY_ALLOWED_ORIGINS below. User Management, Tamagotchi,
# Package Registry, Battle and Notification run as one deploy.replicas block each: every replica
# fills its own container name into {container}, so their allowlist entries are those names. Map,
# Guild and Raid keep one block per replica for their per-replica WebSocket host ports. Replicas of
# one service share that service's stores; each service owns its stores with its own credentials.
# Every store keeps its data in a named volume, so `docker compose down` followed by `up` loses
# nothing; `down -v` is the command that deletes the data.
#
# Battle, Map, Guild, Monster Raid and Notification use real dependencies through Broker.
# Map/Raid select grpc; Guild's real lookup transport is grpc. .env can override the mock/live
# switches for local diagnosis, but mock/compatibility modes do not prove the final gRPC checks.

# A fixed project name: replica container names, which User Management and Battle register as
# their addresses, do not depend on the folder the repository is cloned into.
name: pad-team-11-tamagotchi-go

x-postgres: &postgres
  image: postgres:17-alpine # 18 moved the data directory; the volume path below is 17's
  restart: unless-stopped

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12

x-redis: &redis
  image: redis:7.4-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "redis-cli", "ping"] # authenticates through REDISCLI_AUTH
    interval: 5s
    timeout: 3s
    retries: 12

# The Python services exit instead of retrying when their database is not ready yet, so they wait
# for its health check and restart as a fallback. Their images carry no curl, hence the one-liner.
x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 10s

# Every service trusts only the context the Gateway forwards and stops a request after
# TASK_TIMEOUT_MS (CPR README, "Trusted downstream context" and "Deadlines and concurrent-task
# limits"). Each service sets its own MAX_CONCURRENT_TASKS, chosen by its owner.
x-gateway-context: &gateway-context
  GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
  TASK_TIMEOUT_MS: 3000
  # Lab 3: every replica registers with Discovery on start-up and renews its lease
  # (docs/lab3-discovery-contract.md, "Identity and registration").
  DISCOVERY_URL: http://service-discovery:8090
  # Lab 4: service-to-service calls and events go through the Message Broker
  # (docs/lab4-broker-contract.md): HTTP request queues and topics, and its gRPC listener.
  BROKER_URL: http://message-broker:8091
  BROKER_GRPC_ADDR: message-broker:9091

# Per-service bases: everything replicas of one service share. Each replica below adds only its
# own origins, so no two processes ever advertise the same address.
x-user-management-env: &user-management-env
  <<: *gateway-context
  # bcrypt costs ~200 ms of CPU per login: admit no more than the 10-connection database pool, so excess
  # logins get 429 instead of queueing past TASK_TIMEOUT_MS (contract: overload, timeouts and the last replica).
  MAX_CONCURRENT_TASKS: 10
  DATABASE_URL: postgres://usermgmt:${USERMGMT_DB_PASSWORD}@user-management-db:5432/usermgmt?sslmode=disable
  JWT_ISSUER: user-management
  JWT_AUDIENCE: tamagotchi-go
  JWT_PRIVATE_KEY_PATH: /run/secrets/jwt-signing-key.pem # one key for every replica

x-user-management: &user-management
  image: amzavladislav/tamagotchi-user-management:4.0.2
  restart: unless-stopped
  depends_on:
    message-broker: # Lab 4: calls and events go through it (healthy once SD answered)
      condition: service_healthy
    user-management-db:
      condition: service_healthy
  secrets:
    - source: jwt-signing-key
      target: jwt-signing-key.pem

x-tamagotchi-env: &tamagotchi-env
  <<: *gateway-context
  MAX_CONCURRENT_TASKS: 10
  DATABASE_URL: postgresql+psycopg://tamagotchi:${TAMAGOTCHI_DB_PASSWORD}@tamagotchi-db:5432/tamagotchi

x-tamagotchi: &tamagotchi
  image: crislp/tamagotchi-tamagotchi:4.0.0
  restart: on-failure
  depends_on:
    message-broker: # Lab 4: calls and events go through it (healthy once SD answered)
      condition: service_healthy
    tamagotchi-db:
      condition: service_healthy
  healthcheck:
    <<: *python-healthcheck
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]

x-package-registry-env: &package-registry-env
  <<: *gateway-context
  MAX_CONCURRENT_TASKS: 64
  DATABASE_URL: postgresql+psycopg://registry:${REGISTRY_DB_PASSWORD}@package-registry-db:5432/registry

x-package-registry: &package-registry
  image: gabimiric/tamagotchi-package-registry:4.0.1
  restart: on-failure
  stop_grace_period: 15s # SIGTERM: not ready, deregister, then drain for at most 8 s
  depends_on:
    message-broker: # Lab 4: calls and events go through it (healthy once SD answered)
      condition: service_healthy
    package-registry-db:
      condition: service_healthy
  healthcheck:
    <<: *python-healthcheck
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]

x-battle-env: &battle-env
  <<: *gateway-context
  MAX_CONCURRENT_TASKS: 50
  DATABASE_URL: postgres://battle:${BATTLE_DB_PASSWORD}@battle-db:5432/battle?sslmode=disable
  # live calls Tamagotchi and Package Registry through the Broker's HTTP queues and User Management
  # over gRPC through the Broker (BROKER_URL and BROKER_GRPC_ADDR above); Battle 4.x reads no GATEWAY_URL.
  DEPENDENCY_MODE: ${BATTLE_DEPENDENCY_MODE:-live}

x-battle: &battle
  image: amzavladislav/tamagotchi-battle:4.1.0
  restart: unless-stopped
  depends_on:
    message-broker: # Lab 4: calls and events go through it (healthy once SD answered)
      condition: service_healthy
    battle-db:
      condition: service_healthy

x-map-env: &map-env
  <<: *gateway-context
  MAX_CONCURRENT_TASKS: 50
  MAX_WEBSOCKET_CONNECTIONS: 100
  PORT: 8085
  GATEWAY_JWKS_URL: http://gateway:8080/api/v1/gateway/.well-known/jwks.json
  MAP_STORAGE: redis
  MAP_REDIS_ADDR: map-redis:6379
  MAP_REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
  MAP_REDIS_DB: 0
  MAP_RELATIONSHIP_MODE: ${MAP_RELATIONSHIP_MODE:-grpc}

x-map: &map
  image: nickseen/tamagotchi-map:4.0.1 # its image declares the /healthz check
  restart: on-failure # a single Redis ping at start-up, no retry
  depends_on:
    message-broker: # Lab 4: calls and events go through it (healthy once SD answered)
      condition: service_healthy
    map-redis:
      condition: service_healthy

x-notification-env: &notification-env
  <<: *gateway-context
  MAX_CONCURRENT_TASKS: 10
  DATABASE_URL: postgresql+psycopg://notification:${NOTIFICATION_DB_PASSWORD}@notification-db:5432/notification
  # Guild member reads use BROKER_GRPC_ADDR; event publication/delivery uses Broker topics.

x-notification: &notification
  image: crislp/tamagotchi-notification:4.0.0
  restart: on-failure
  depends_on:
    message-broker: # Lab 4: calls and events go through it (healthy once SD answered)
      condition: service_healthy
    notification-db:
      condition: service_healthy
  healthcheck:
    <<: *python-healthcheck
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')"]

x-guild-env: &guild-env
  <<: *gateway-context
  MAX_CONCURRENT_TASKS: 64
  MAX_WEBSOCKET_CONNECTIONS: 100
  DATABASE_URL: postgresql+psycopg://guild:${GUILD_DB_PASSWORD}@guild-db:5432/guild
  USER_MANAGEMENT_MODE: ${GUILD_USER_MANAGEMENT_MODE:-real}
  # Invitee lookups call UserManagementInternal/ListUsers over gRPC through the Broker (Lab 4 Grade 8).
  USER_MANAGEMENT_TRANSPORT: grpc
  GATEWAY_JWKS_URL: http://gateway:8080/api/v1/gateway/.well-known/jwks.json
  CHAT_BROKER: redis
  REDIS_URL: redis://:${GUILD_REDIS_PASSWORD}@guild-redis:6379/0

x-guild: &guild
  image: gabimiric/tamagotchi-guild:4.0.0
  restart: on-failure
  stop_grace_period: 15s # SIGTERM: not ready, deregister, then drain for at most 8 s
  depends_on:
    message-broker: # Lab 4: calls and events go through it (healthy once SD answered)
      condition: service_healthy
    guild-db:
      condition: service_healthy
    guild-redis:
      condition: service_healthy
  healthcheck:
    <<: *python-healthcheck
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health')"]

x-monster-raid-env: &monster-raid-env
  <<: *gateway-context
  MAX_CONCURRENT_TASKS: 50
  MAX_WEBSOCKET_CONNECTIONS: 100
  RAID_ADDR: ":8088"
  RAID_STORAGE: postgres-redis
  DATABASE_URL: postgres://raid:${RAID_DB_PASSWORD}@monster-raid-db:5432/raid?sslmode=disable
  RAID_REDIS_ADDR: monster-raid-redis:6379
  RAID_REDIS_PASSWORD: ${RAID_REDIS_PASSWORD}
  RAID_REDIS_DB: 0
  RAID_DEPENDENCY_MODE: ${RAID_DEPENDENCY_MODE:-grpc}
  RAID_MOCK_FAILURE: "false"
  GATEWAY_JWKS_URL: http://gateway:8080/api/v1/gateway/.well-known/jwks.json

x-monster-raid: &monster-raid
  image: nickseen/tamagotchi-monster-raid:4.0.0 # its image declares the /healthz check
  restart: on-failure
  depends_on:
    message-broker: # Lab 4: calls and events go through it (healthy once SD answered)
      condition: service_healthy
    monster-raid-db:
      condition: service_healthy
    monster-raid-redis:
      condition: service_healthy

services:
  # --- Service Discovery ----------------------------------------------------------------------------
  service-discovery:
    image: nickseen/tamagotchi-service-discovery:4.0.1 # Lab 4 topics/gRPC registrations, monitor and alerts
    restart: unless-stopped
    environment:
      PORT: 8090
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      MAX_CONCURRENT_TASKS: 50
      MONITOR_INTERVAL_MS: 5000
      MONITOR_TIMEOUT_MS: 1000
      MONITOR_CONCURRENCY: 10
      # Telegram alerts for critical load and health failures. ALERTS_ENABLED=false only logs them.
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # The only origins a replica may register: its internal base URL, for the three live
      # services its own published WebSocket origin and, since Lab 4, the gRPC address the Broker
      # forwards internal RPCs to (same hostname as the base URL). -3 entries serve the third replicas;
      # User Management, Tamagotchi, Package Registry, Battle and Notification list their deploy.replicas
      # container names, -1 to -5.
      DISCOVERY_ALLOWED_ORIGINS: >-
        {"user-management":{"baseUrls":["http://pad-team-11-tamagotchi-go-user-management-1:8081","http://pad-team-11-tamagotchi-go-user-management-2:8081","http://pad-team-11-tamagotchi-go-user-management-3:8081","http://pad-team-11-tamagotchi-go-user-management-4:8081","http://pad-team-11-tamagotchi-go-user-management-5:8081"],"grpcAddresses":["pad-team-11-tamagotchi-go-user-management-1:9081","pad-team-11-tamagotchi-go-user-management-2:9081","pad-team-11-tamagotchi-go-user-management-3:9081","pad-team-11-tamagotchi-go-user-management-4:9081","pad-team-11-tamagotchi-go-user-management-5:9081"]},"tamagotchi":{"baseUrls":["http://pad-team-11-tamagotchi-go-tamagotchi-1:8082","http://pad-team-11-tamagotchi-go-tamagotchi-2:8082","http://pad-team-11-tamagotchi-go-tamagotchi-3:8082","http://pad-team-11-tamagotchi-go-tamagotchi-4:8082","http://pad-team-11-tamagotchi-go-tamagotchi-5:8082"],"grpcAddresses":["pad-team-11-tamagotchi-go-tamagotchi-1:9082","pad-team-11-tamagotchi-go-tamagotchi-2:9082","pad-team-11-tamagotchi-go-tamagotchi-3:9082","pad-team-11-tamagotchi-go-tamagotchi-4:9082","pad-team-11-tamagotchi-go-tamagotchi-5:9082"]},"package-registry":{"baseUrls":["http://pad-team-11-tamagotchi-go-package-registry-1:8083","http://pad-team-11-tamagotchi-go-package-registry-2:8083","http://pad-team-11-tamagotchi-go-package-registry-3:8083","http://pad-team-11-tamagotchi-go-package-registry-4:8083","http://pad-team-11-tamagotchi-go-package-registry-5:8083"],"grpcAddresses":["pad-team-11-tamagotchi-go-package-registry-1:9083","pad-team-11-tamagotchi-go-package-registry-2:9083","pad-team-11-tamagotchi-go-package-registry-3:9083","pad-team-11-tamagotchi-go-package-registry-4:9083","pad-team-11-tamagotchi-go-package-registry-5:9083"]},"battle":{"baseUrls":["http://pad-team-11-tamagotchi-go-battle-1:8084","http://pad-team-11-tamagotchi-go-battle-2:8084","http://pad-team-11-tamagotchi-go-battle-3:8084","http://pad-team-11-tamagotchi-go-battle-4:8084","http://pad-team-11-tamagotchi-go-battle-5:8084"]},"map":{"baseUrls":["http://map-1:8085","http://map-2:8085","http://map-3:8085"],"wsPublicUrls":["ws://localhost:18085","ws://localhost:28085","ws://localhost:38085"],"grpcAddresses":["map-1:9085","map-2:9085","map-3:9085"]},"notification":{"baseUrls":["http://pad-team-11-tamagotchi-go-notification-1:8086","http://pad-team-11-tamagotchi-go-notification-2:8086","http://pad-team-11-tamagotchi-go-notification-3:8086","http://pad-team-11-tamagotchi-go-notification-4:8086","http://pad-team-11-tamagotchi-go-notification-5:8086"]},"guild":{"baseUrls":["http://guild-1:8087","http://guild-2:8087","http://guild-3:8087"],"wsPublicUrls":["ws://localhost:18087","ws://localhost:28087","ws://localhost:38087"],"grpcAddresses":["guild-1:9087","guild-2:9087","guild-3:9087"]},"monster-raid":{"baseUrls":["http://monster-raid-1:8088","http://monster-raid-2:8088","http://monster-raid-3:8088"],"wsPublicUrls":["ws://localhost:18088","ws://localhost:28088","ws://localhost:38088"],"grpcAddresses":["monster-raid-1:9088","monster-raid-2:9088","monster-raid-3:9088"]}}
    # Internal only: no host port. Replicas, the Gateway and probes reach it on the Compose network.

  # --- Message Broker (Lab 4) -----------------------------------------------------------------------
  # Request queues and topics for every service-to-service call and event, gRPC forwarding,
  # least-load routing, breakers and durable queues (docs/lab4-broker-contract.md).
  # Published release; the matching main source is pinned in services/message-broker.
  message-broker:
    image: nickseen/tamagotchi-message-broker:4.0.0
    restart: unless-stopped
    depends_on:
      service-discovery:
        condition: service_healthy
    environment:
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      DISCOVERY_URL: http://service-discovery:8090
      DATA_DIR: /data # durable topic queues and dead letters survive a restart
      LB_STRATEGY: ${BROKER_LB_STRATEGY:-least-load} # or round-robin
    volumes:
      - broker-data:/data
    healthcheck:
      # Distroless image: the binary is its own health check (healthy once SD has answered).
      test: ["CMD", "/usr/local/bin/message-broker", "healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    ports:
      # Local inspection only (topics, dead letters, replay need SERVICE_TOKEN); never public.
      - "127.0.0.1:8091:8091"

  # --- API Gateway ----------------------------------------------------------------------------------
  gateway:
    image: nickseen/tamagotchi-gateway:4.0.1 # Broker queues, gRPC ticket checks and system logs
    restart: unless-stopped
    depends_on:
      service-discovery:
        condition: service_healthy
      message-broker:
        condition: service_healthy
    environment:
      # Lab 4: Gateway forwards client traffic to the Broker's request queues (#153).
      BROKER_URL: http://message-broker:8091
      BROKER_GRPC_ADDR: message-broker:9091
      LOKI_URL: http://loki:3100
      # Discovery selects the replica for a direct WebSocket URL; REST and JWKS use Broker queues.
      DISCOVERY_URL: http://service-discovery:8090
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      # Above the services' 3000 ms, so their 503 TASK_TIMEOUT arrives before the Gateway's 504.
      REQUEST_TIMEOUT_MS: 5000
      MAX_IN_FLIGHT_REQUESTS: 100
    ports:
      - "8080:8080"

  # --- User Management ------------------------------------------------------------------------------
  user-management-db:
    <<: *postgres
    environment:
      POSTGRES_DB: usermgmt
      POSTGRES_USER: usermgmt
      POSTGRES_PASSWORD: ${USERMGMT_DB_PASSWORD:?set USERMGMT_DB_PASSWORD in .env}
    volumes:
      - usermgmt-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U usermgmt -d usermgmt"]

  # Every replica signs access tokens with the same mounted key, so a token from one validates
  # against the key set any other publishes.
  # One block runs every User Management replica (deploy.replicas, the default 2 or
  # USER_MANAGEMENT_REPLICAS). Each replica fills its own container name into {container}
  # (pad-team-11-tamagotchi-go-user-management-<n>) before it registers; the Discovery allowlist
  # admits up to five. Scale with `docker compose up -d --scale user-management=3`.
  user-management:
    <<: *user-management
    deploy:
      replicas: ${USER_MANAGEMENT_REPLICAS:-2}
    environment:
      <<: *user-management-env
      INSTANCE_BASE_URL: "http://{container}:8081"
      INSTANCE_GRPC_ADDRESS: "{container}:9081"

  # --- Tamagotchi -----------------------------------------------------------------------------------
  tamagotchi-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tamagotchi
      POSTGRES_USER: tamagotchi
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD:?set TAMAGOTCHI_DB_PASSWORD in .env}
    volumes:
      - tamagotchi-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U tamagotchi -d tamagotchi"]

  # One block runs every Tamagotchi replica (deploy.replicas, the default 2 or TAMAGOTCHI_REPLICAS).
  # Each replica fills its own container name into {container}
  # (pad-team-11-tamagotchi-go-tamagotchi-<n>) before it registers (4.0.0, #176); the Discovery
  # allowlist admits up to five. Scale with `docker compose up -d --scale tamagotchi=3`.
  tamagotchi:
    <<: *tamagotchi
    deploy:
      replicas: ${TAMAGOTCHI_REPLICAS:-2}
    environment:
      <<: *tamagotchi-env
      INSTANCE_BASE_URL: "http://{container}:8082"
      INSTANCE_GRPC_ADDRESS: "{container}:9082"

  # --- Package Registry -----------------------------------------------------------------------------
  package-registry-db:
    <<: *postgres
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env}
    volumes:
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]

  # One block runs every Package Registry replica (deploy.replicas, the default 2 or
  # PACKAGE_REGISTRY_REPLICAS). Each replica fills its own container name into {container}
  # (pad-team-11-tamagotchi-go-package-registry-<n>) before it registers (4.0.1, #178); the
  # Discovery allowlist admits up to five. Scale with `docker compose up -d --scale package-registry=3`.
  package-registry:
    <<: *package-registry
    deploy:
      replicas: ${PACKAGE_REGISTRY_REPLICAS:-2}
    environment:
      <<: *package-registry-env
      INSTANCE_BASE_URL: "http://{container}:8083"
      INSTANCE_GRPC_ADDRESS: "{container}:9083"

  # --- Battle ---------------------------------------------------------------------------------------
  battle-db:
    <<: *postgres
    environment:
      POSTGRES_DB: battle
      POSTGRES_USER: battle
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD:?set BATTLE_DB_PASSWORD in .env}
    volumes:
      - battle-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U battle -d battle"]

  # One block runs every Battle replica (deploy.replicas, the default 2 or BATTLE_REPLICAS), as
  # for User Management above: pad-team-11-tamagotchi-go-battle-<n>, up to five.
  battle:
    <<: *battle
    deploy:
      replicas: ${BATTLE_REPLICAS:-2}
    environment:
      <<: *battle-env
      INSTANCE_BASE_URL: "http://{container}:8084"

  # --- Map ------------------------------------------------------------------------------------------
  map-redis:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${MAP_REDIS_PASSWORD:?set MAP_REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}
    volumes:
      - map-redis-data:/data

  map-1:
    <<: *map
    environment:
      <<: *map-env
      INSTANCE_BASE_URL: http://map-1:8085
      INSTANCE_GRPC_ADDRESS: map-1:9085
      INSTANCE_WS_PUBLIC_URL: ws://localhost:18085
    ports:
      - "18085:8085" # this replica's direct WebSocket origin

  map-2:
    <<: *map
    environment:
      <<: *map-env
      INSTANCE_BASE_URL: http://map-2:8085
      INSTANCE_GRPC_ADDRESS: map-2:9085
      INSTANCE_WS_PUBLIC_URL: ws://localhost:28085
    ports:
      - "28085:8085" # this replica's direct WebSocket origin

  map-3:
    <<: *map
    profiles: [scale-map, scale-all] # the optional third replica
    environment:
      <<: *map-env
      INSTANCE_BASE_URL: http://map-3:8085
      INSTANCE_GRPC_ADDRESS: map-3:9085
      INSTANCE_WS_PUBLIC_URL: ws://localhost:38085
    ports:
      - "38085:8085" # this replica's direct WebSocket origin

  # --- Notification ---------------------------------------------------------------------------------
  notification-db:
    <<: *postgres
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]

  # One block runs every Notification replica (deploy.replicas, the default 2 or
  # NOTIFICATION_REPLICAS). Each replica fills its own container name into {container}
  # (pad-team-11-tamagotchi-go-notification-<n>) before it registers (4.0.0, #177); the Discovery
  # allowlist admits up to five. Scale with `docker compose up -d --scale notification=3`.
  notification:
    <<: *notification
    deploy:
      replicas: ${NOTIFICATION_REPLICAS:-2}
    environment:
      <<: *notification-env
      INSTANCE_BASE_URL: "http://{container}:8086"

  # --- Guild ----------------------------------------------------------------------------------------
  guild-db:
    <<: *postgres
    environment:
      POSTGRES_DB: guild
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD:?set GUILD_DB_PASSWORD in .env}
    volumes:
      - guild-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U guild -d guild"]

  guild-redis:
    <<: *redis
    command: ["redis-server", "--requirepass", "${GUILD_REDIS_PASSWORD:?set GUILD_REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${GUILD_REDIS_PASSWORD}

  guild-1:
    <<: *guild
    environment:
      <<: *guild-env
      INSTANCE_BASE_URL: http://guild-1:8087
      INSTANCE_GRPC_ADDRESS: guild-1:9087
      INSTANCE_WS_PUBLIC_URL: ws://localhost:18087
    ports:
      - "18087:8087" # this replica's direct WebSocket origin

  guild-2:
    <<: *guild
    environment:
      <<: *guild-env
      INSTANCE_BASE_URL: http://guild-2:8087
      INSTANCE_GRPC_ADDRESS: guild-2:9087
      INSTANCE_WS_PUBLIC_URL: ws://localhost:28087
    ports:
      - "28087:8087" # this replica's direct WebSocket origin

  guild-3:
    <<: *guild
    profiles: [scale-guild, scale-all] # the optional third replica
    environment:
      <<: *guild-env
      INSTANCE_BASE_URL: http://guild-3:8087
      INSTANCE_GRPC_ADDRESS: guild-3:9087
      INSTANCE_WS_PUBLIC_URL: ws://localhost:38087
    ports:
      - "38087:8087" # this replica's direct WebSocket origin

  # --- Monster Raid ---------------------------------------------------------------------------------
  monster-raid-db:
    <<: *postgres
    environment:
      POSTGRES_DB: raid
      POSTGRES_USER: raid
      POSTGRES_PASSWORD: ${RAID_DB_PASSWORD:?set RAID_DB_PASSWORD in .env}
    volumes:
      - raid-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U raid -d raid"]

  monster-raid-redis:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${RAID_REDIS_PASSWORD:?set RAID_REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${RAID_REDIS_PASSWORD}
    volumes:
      - raid-redis-data:/data

  monster-raid-1:
    <<: *monster-raid
    environment:
      <<: *monster-raid-env
      INSTANCE_BASE_URL: http://monster-raid-1:8088
      INSTANCE_GRPC_ADDRESS: monster-raid-1:9088
      INSTANCE_WS_PUBLIC_URL: ws://localhost:18088
    ports:
      - "18088:8088" # this replica's direct WebSocket origin

  monster-raid-2:
    <<: *monster-raid
    environment:
      <<: *monster-raid-env
      INSTANCE_BASE_URL: http://monster-raid-2:8088
      INSTANCE_GRPC_ADDRESS: monster-raid-2:9088
      INSTANCE_WS_PUBLIC_URL: ws://localhost:28088
    ports:
      - "28088:8088" # this replica's direct WebSocket origin

  monster-raid-3:
    <<: *monster-raid
    profiles: [scale-monster-raid, scale-all] # the optional third replica
    environment:
      <<: *monster-raid-env
      INSTANCE_BASE_URL: http://monster-raid-3:8088
      INSTANCE_GRPC_ADDRESS: monster-raid-3:9088
      INSTANCE_WS_PUBLIC_URL: ws://localhost:38088
    ports:
      - "38088:8088" # this replica's direct WebSocket origin

  # --- Monitoring (Lab 4 Grade 10, #154) -------------------------------------------------------------
  # Prometheus scrapes every /metrics; Alloy ships every container's JSON logs to Loki; Grafana shows
  # both. Only Grafana (and Prometheus, for ad-hoc queries) are published, on loopback.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    # Internal only: Grafana and the downloadable-logs endpoint (#155) read http://loki:3100.

  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    depends_on:
      - loki
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data",
              "/etc/alloy/config.alloy"]
    environment:
      # The Compose project whose containers are collected (the default is this folder's name).
      LOG_PROJECT: ${COMPOSE_PROJECT_NAME:-pad-team-11-tamagotchi-go}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # read-only: to discover containers and read their logs

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Anyone on this machine can look; only admin can change anything.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/broker.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

secrets:
  jwt-signing-key:
    file: ./secrets/jwt-signing-key.pem # git-ignored; see the header for how to create it

volumes:
  usermgmt-data:
  tamagotchi-data:
  registry-data:
  battle-data:
  map-redis-data:
  notification-data:
  guild-data:
  raid-data:
  raid-redis-data:
  broker-data: # the Broker's durable topic queues and dead letters
  prometheus-data:
  loki-data:
  grafana-data:
