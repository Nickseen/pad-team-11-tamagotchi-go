  POSTGRES_PASSWORD: ${RAID_DB_PASSWORD:?set RAID_DB_PASSWORD in .env}
  PG_REPLICATION_PASSWORD: ${RAID_REPLICATION_PASSWORD:?set RAID_REPLICATION_PASSWORD in .env}

x-tamagotchi-db-env: &tamagotchi-db-env
