# The whole Tamagotchi Go ecosystem: eight services and the stores each one owns, run from the
# images published on Docker Hub. Nothing here is built locally.
#
#   cp .env.example .env    # replace every CHANGE_ME
#   docker compose up -d
#
# Every service reaches the others by its compose name — the same hostnames the communication
# contract uses — and publishes its port on localhost for Postman. Databases are internal only.
#
# Each service owns its own store with its own credentials; no service can reach another's. Every
# store keeps its data in a named volume, so `docker compose down` followed by `up` loses nothing.
# `docker compose down -v` is the command that deletes the data.
#
# Dependency modes: every service starts with its cross-service calls mocked, so the stack comes up
# green on its own. Each *_MODE variable in .env switches one service to call its neighbours for real.

x-postgres: &postgres
  image: postgres:17-alpine # 18 moved the data directory; the volume path below is 17's
  restart: unless-stopped

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12

x-redis: &redis
  image: redis:7.4-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "redis-cli", "ping"] # authenticates through REDISCLI_AUTH
    interval: 5s
    timeout: 3s
    retries: 12

# The Python services exit instead of retrying when their database is not ready yet, so they wait
# for its health check and restart as a fallback. Their images carry no curl, hence the one-liner.
x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 10s

services:
  # --- User Management -------------------------------------------------------------------------
  user-management-db:
    <<: *postgres
    environment:
      POSTGRES_DB: usermgmt
      POSTGRES_USER: usermgmt
      POSTGRES_PASSWORD: ${USERMGMT_DB_PASSWORD:?set USERMGMT_DB_PASSWORD in .env}
    volumes:
      - usermgmt-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U usermgmt -d usermgmt"]

  user-management:
    image: amzavladislav/tamagotchi-user-management:1.1.0
    restart: unless-stopped
    depends_on:
      user-management-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://usermgmt:${USERMGMT_DB_PASSWORD}@user-management-db:5432/usermgmt?sslmode=disable
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      JWT_ISSUER: user-management
      JWT_AUDIENCE: tamagotchi-go
    ports:
      - "8081:8081"

  # --- Tamagotchi ------------------------------------------------------------------------------
  tamagotchi-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tamagotchi
      POSTGRES_USER: tamagotchi
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD:?set TAMAGOTCHI_DB_PASSWORD in .env}
    volumes:
      - tamagotchi-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U tamagotchi -d tamagotchi"]

  tamagotchi:
    image: crislp/tamagotchi-tamagotchi:2.1.0
    restart: on-failure
    depends_on:
      tamagotchi-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://tamagotchi:${TAMAGOTCHI_DB_PASSWORD}@tamagotchi-db:5432/tamagotchi
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      JWKS_URL: http://user-management:8081/api/v1/.well-known/jwks.json
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]
    ports:
      - "8082:8082"

  # --- Package Registry ------------------------------------------------------------------------
  package-registry-db:
    <<: *postgres
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env}
    volumes:
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]

  package-registry:
    image: gabimiric/tamagotchi-package-registry:0.3.0
    restart: on-failure
    depends_on:
      package-registry-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://registry:${REGISTRY_DB_PASSWORD}@package-registry-db:5432/registry
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]
    ports:
      - "8083:8083"

  # --- Battle ----------------------------------------------------------------------------------
  battle-db:
    <<: *postgres
    environment:
      POSTGRES_DB: battle
      POSTGRES_USER: battle
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD:?set BATTLE_DB_PASSWORD in .env}
    volumes:
      - battle-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U battle -d battle"]

  battle:
    image: amzavladislav/tamagotchi-battle:1.1.0
    restart: unless-stopped
    depends_on:
      battle-db:
        condition: service_healthy
      user-management:
        condition: service_started # access tokens are validated against its published keys
    environment:
      DATABASE_URL: postgres://battle:${BATTLE_DB_PASSWORD}@battle-db:5432/battle?sslmode=disable
      SERVICE_TOKEN: ${SERVICE_TOKEN}
      JWKS_URL: http://user-management:8081/api/v1/.well-known/jwks.json
      DEPENDENCY_MODE: ${BATTLE_DEPENDENCY_MODE:-mock}
      TAMAGOTCHI_URL: http://tamagotchi:8082
      PACKAGE_REGISTRY_URL: http://package-registry:8083
      USER_MANAGEMENT_URL: http://user-management:8081
    ports:
      - "8084:8084"

  # --- Map -------------------------------------------------------------------------------------
  map-redis:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${MAP_REDIS_PASSWORD:?set MAP_REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}
    volumes:
      - map-redis-data:/data

  map:
    image: nickseen/tamagotchi-map:1.1.0
    restart: on-failure # a single Redis ping at start-up, no retry
    depends_on:
      map-redis:
        condition: service_healthy
    environment:
      PORT: 8085
      MAP_AUTH_TOKENS: ${MAP_AUTH_TOKENS:?set MAP_AUTH_TOKENS in .env}
      MAP_SERVICE_TOKEN: ${SERVICE_TOKEN}
      MAP_STORAGE: redis
      MAP_REDIS_ADDR: map-redis:6379
      MAP_REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
      MAP_REDIS_DB: 0
      MAP_RELATIONSHIP_MODE: ${MAP_RELATIONSHIP_MODE:-mock}
      MAP_USER_MANAGEMENT_URL: http://user-management:8081
      MAP_MOCK_RELATIONSHIP_FAILURE: "false"
    ports:
      - "8085:8085"

  # --- Notification ----------------------------------------------------------------------------
  notification-db:
    <<: *postgres
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]

  notification:
    image: crislp/tamagotchi-notification:2.1.0
    restart: on-failure
    depends_on:
      notification-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://notification:${NOTIFICATION_DB_PASSWORD}@notification-db:5432/notification
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      JWKS_URL: http://user-management:8081/api/v1/.well-known/jwks.json
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')"]
    ports:
      - "8086:8086"

  # --- Guild -----------------------------------------------------------------------------------
  guild-db:
    <<: *postgres
    environment:
      POSTGRES_DB: guild
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD:?set GUILD_DB_PASSWORD in .env}
    volumes:
      - guild-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U guild -d guild"]

  guild:
    image: gabimiric/tamagotchi-guild:0.3.0
    restart: on-failure
    depends_on:
      guild-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://guild:${GUILD_DB_PASSWORD}@guild-db:5432/guild
      USER_MANAGEMENT_MODE: ${GUILD_USER_MANAGEMENT_MODE:-mock}
      USER_MANAGEMENT_URL: http://user-management:8081
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health')"]
    ports:
      - "8087:8087"

  # --- Monster Raid ----------------------------------------------------------------------------
  monster-raid-db:
    <<: *postgres
    environment:
      POSTGRES_DB: raid
      POSTGRES_USER: raid
      POSTGRES_PASSWORD: ${RAID_DB_PASSWORD:?set RAID_DB_PASSWORD in .env}
    volumes:
      - raid-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U raid -d raid"]

  monster-raid-redis:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${RAID_REDIS_PASSWORD:?set RAID_REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${RAID_REDIS_PASSWORD}
    volumes:
      - raid-redis-data:/data

  monster-raid:
    image: nickseen/tamagotchi-monster-raid:1.1.0
    restart: on-failure
    depends_on:
      monster-raid-db:
        condition: service_healthy
      monster-raid-redis:
        condition: service_healthy
    environment:
      RAID_ADDR: ":8088"
      RAID_AUTH_TOKENS: ${RAID_AUTH_TOKENS:?set RAID_AUTH_TOKENS in .env}
      RAID_SERVICE_TOKEN: ${SERVICE_TOKEN}
      RAID_STORAGE: postgres-redis
      DATABASE_URL: postgres://raid:${RAID_DB_PASSWORD}@monster-raid-db:5432/raid?sslmode=disable
      RAID_REDIS_ADDR: monster-raid-redis:6379
      RAID_REDIS_PASSWORD: ${RAID_REDIS_PASSWORD}
      RAID_REDIS_DB: 0
      RAID_DEPENDENCY_MODE: ${RAID_DEPENDENCY_MODE:-mock}
      RAID_MOCK_FAILURE: "false"
      RAID_GUILD_URL: http://guild:8087
      RAID_REGISTRY_URL: http://package-registry:8083
      RAID_TAMAGOTCHI_URL: http://tamagotchi:8082
    ports:
      - "8088:8088"

volumes:
  usermgmt-data:
  tamagotchi-data:
  registry-data:
  battle-data:
  map-redis-data:
  notification-data:
  guild-data:
  raid-data:
  raid-redis-data:
