# The whole Tamagotchi Go ecosystem behind the API Gateway: the Gateway, the eight services and the
# stores each one owns, run from the Lab 2 images published on Docker Hub. Nothing is built locally.
#
#   cp .env.example .env    # replace every CHANGE_ME
#   docker compose up -d
#
# Clients reach the system only through the Gateway on localhost:8080, as /<service>/api/v1/...;
# services call each other through it too, at http://gateway:8080. Map, Guild and Monster Raid also
# publish their ports, because clients open their WebSockets directly with a ticket the Gateway
# issues. No other service and no store is reachable from the host.
#
# Each service owns its own store with its own credentials; no service can reach another's. Every
# store keeps its data in a named volume, so `docker compose down` followed by `up` loses nothing.
# `docker compose down -v` is the command that deletes the data.
#
# Dependency modes: Battle, Map and Guild call their neighbours for real through the Gateway, and
# Notification asks Guild for members the same way. Monster Raid starts with its neighbours mocked,
# because a real raid needs an admin-created raid definition and User Management issues no admin
# role. Each *_MODE variable in .env switches one service between mocked and real neighbours.

x-postgres: &postgres
  image: postgres:17-alpine # 18 moved the data directory; the volume path below is 17's
  restart: unless-stopped

x-postgres-healthcheck: &postgres-healthcheck
  interval: 5s
  timeout: 3s
  retries: 12

x-redis: &redis
  image: redis:7.4-alpine
  restart: unless-stopped
  healthcheck:
    test: ["CMD", "redis-cli", "ping"] # authenticates through REDISCLI_AUTH
    interval: 5s
    timeout: 3s
    retries: 12

# The Python services exit instead of retrying when their database is not ready yet, so they wait
# for its health check and restart as a fallback. Their images carry no curl, hence the one-liner.
x-python-healthcheck: &python-healthcheck
  interval: 10s
  timeout: 3s
  retries: 6
  start_period: 10s

# Every service trusts only the context the Gateway forwards and stops a request after
# TASK_TIMEOUT_MS (CPR README, "Trusted downstream context" and "Deadlines and concurrent-task
# limits"). Each service sets its own MAX_CONCURRENT_TASKS, chosen by its owner.
x-gateway-context: &gateway-context
  GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
  SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
  TASK_TIMEOUT_MS: 3000

services:
  # --- API Gateway -----------------------------------------------------------------------------
  gateway:
    image: nickseen/tamagotchi-gateway:2.0.0 # its image declares the /health check
    restart: unless-stopped
    depends_on:
      user-management:
        condition: service_started # access tokens are validated against its published keys
    environment:
      USER_MANAGEMENT_URL: http://user-management:8081
      TAMAGOTCHI_URL: http://tamagotchi:8082
      PACKAGE_REGISTRY_URL: http://package-registry:8083
      BATTLE_URL: http://battle:8084
      MAP_URL: http://map:8085
      NOTIFICATION_URL: http://notification:8086
      GUILD_URL: http://guild:8087
      MONSTER_RAID_URL: http://monster-raid:8088
      # Returned to clients in WebSocket tickets, so they must be reachable from the client's host.
      MAP_WS_PUBLIC_URL: ${MAP_WS_PUBLIC_URL:-ws://localhost:8085}
      GUILD_WS_PUBLIC_URL: ${GUILD_WS_PUBLIC_URL:-ws://localhost:8087}
      MONSTER_RAID_WS_PUBLIC_URL: ${MONSTER_RAID_WS_PUBLIC_URL:-ws://localhost:8088}
      GATEWAY_TOKEN: ${GATEWAY_TOKEN:?set GATEWAY_TOKEN in .env}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?set SERVICE_TOKEN in .env}
      # Above the services' 3000 ms, so their 503 TASK_TIMEOUT arrives before the Gateway's 504.
      REQUEST_TIMEOUT_MS: 5000
      MAX_IN_FLIGHT_REQUESTS: 100
    ports:
      - "8080:8080"

  # --- User Management -------------------------------------------------------------------------
  user-management-db:
    <<: *postgres
    environment:
      POSTGRES_DB: usermgmt
      POSTGRES_USER: usermgmt
      POSTGRES_PASSWORD: ${USERMGMT_DB_PASSWORD:?set USERMGMT_DB_PASSWORD in .env}
    volumes:
      - usermgmt-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U usermgmt -d usermgmt"]

  user-management:
    image: amzavladislav/tamagotchi-user-management:2.0.0
    restart: unless-stopped
    depends_on:
      user-management-db:
        condition: service_healthy
    environment:
      <<: *gateway-context
      MAX_CONCURRENT_TASKS: 50
      DATABASE_URL: postgres://usermgmt:${USERMGMT_DB_PASSWORD}@user-management-db:5432/usermgmt?sslmode=disable
      JWT_ISSUER: user-management
      JWT_AUDIENCE: tamagotchi-go

  # --- Tamagotchi ------------------------------------------------------------------------------
  tamagotchi-db:
    <<: *postgres
    environment:
      POSTGRES_DB: tamagotchi
      POSTGRES_USER: tamagotchi
      POSTGRES_PASSWORD: ${TAMAGOTCHI_DB_PASSWORD:?set TAMAGOTCHI_DB_PASSWORD in .env}
    volumes:
      - tamagotchi-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U tamagotchi -d tamagotchi"]

  tamagotchi:
    image: crislp/tamagotchi-tamagotchi:2.2.0
    restart: on-failure
    depends_on:
      tamagotchi-db:
        condition: service_healthy
    environment:
      <<: *gateway-context
      MAX_CONCURRENT_TASKS: 10
      DATABASE_URL: postgresql+psycopg://tamagotchi:${TAMAGOTCHI_DB_PASSWORD}@tamagotchi-db:5432/tamagotchi
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8082/health')"]

  # --- Package Registry ------------------------------------------------------------------------
  package-registry-db:
    <<: *postgres
    environment:
      POSTGRES_DB: registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: ${REGISTRY_DB_PASSWORD:?set REGISTRY_DB_PASSWORD in .env}
    volumes:
      - registry-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U registry -d registry"]

  package-registry:
    image: gabimiric/tamagotchi-package-registry:2.1.0
    restart: on-failure
    depends_on:
      package-registry-db:
        condition: service_healthy
    environment:
      <<: *gateway-context
      MAX_CONCURRENT_TASKS: 64
      DATABASE_URL: postgresql+psycopg://registry:${REGISTRY_DB_PASSWORD}@package-registry-db:5432/registry
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8083/health')"]

  # --- Battle ----------------------------------------------------------------------------------
  battle-db:
    <<: *postgres
    environment:
      POSTGRES_DB: battle
      POSTGRES_USER: battle
      POSTGRES_PASSWORD: ${BATTLE_DB_PASSWORD:?set BATTLE_DB_PASSWORD in .env}
    volumes:
      - battle-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U battle -d battle"]

  battle:
    image: amzavladislav/tamagotchi-battle:2.0.1
    restart: unless-stopped
    depends_on:
      battle-db:
        condition: service_healthy
    environment:
      <<: *gateway-context
      MAX_CONCURRENT_TASKS: 50
      DATABASE_URL: postgres://battle:${BATTLE_DB_PASSWORD}@battle-db:5432/battle?sslmode=disable
      # live calls Tamagotchi, Package Registry and User Management through the Gateway only.
      DEPENDENCY_MODE: ${BATTLE_DEPENDENCY_MODE:-live}
      GATEWAY_URL: http://gateway:8080

  # --- Map -------------------------------------------------------------------------------------
  map-redis:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${MAP_REDIS_PASSWORD:?set MAP_REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${MAP_REDIS_PASSWORD}
    volumes:
      - map-redis-data:/data

  map:
    image: nickseen/tamagotchi-map:2.1.1 # its image declares the /healthz check
    restart: on-failure # a single Redis ping at start-up, no retry
    depends_on:
      map-redis:
        condition: service_healthy
    environment:
      <<: *gateway-context
      MAX_CONCURRENT_TASKS: 50
      MAX_WEBSOCKET_CONNECTIONS: 100
      PORT: 8085
      GATEWAY_URL: http://gateway:8080
      GATEWAY_JWKS_URL: http://gateway:8080/api/v1/gateway/.well-known/jwks.json
      MAP_STORAGE: redis
      MAP_REDIS_ADDR: map-redis:6379
      MAP_REDIS_PASSWORD: ${MAP_REDIS_PASSWORD}
      MAP_REDIS_DB: 0
      MAP_RELATIONSHIP_MODE: ${MAP_RELATIONSHIP_MODE:-http}
      MAP_EVENTS_MODE: disabled # the stack has no RabbitMQ yet
    ports:
      - "8085:8085" # direct live-map WebSocket

  # --- Notification ----------------------------------------------------------------------------
  notification-db:
    <<: *postgres
    environment:
      POSTGRES_DB: notification
      POSTGRES_USER: notification
      POSTGRES_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in .env}
    volumes:
      - notification-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U notification -d notification"]

  notification:
    image: crislp/tamagotchi-notification:2.2.0
    restart: on-failure
    depends_on:
      notification-db:
        condition: service_healthy
    environment:
      <<: *gateway-context
      MAX_CONCURRENT_TASKS: 10
      DATABASE_URL: postgresql+psycopg://notification:${NOTIFICATION_DB_PASSWORD}@notification-db:5432/notification
      GATEWAY_URL: http://gateway:8080 # guild members are read from Guild through it
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8086/health')"]

  # --- Guild -----------------------------------------------------------------------------------
  guild-db:
    <<: *postgres
    environment:
      POSTGRES_DB: guild
      POSTGRES_USER: guild
      POSTGRES_PASSWORD: ${GUILD_DB_PASSWORD:?set GUILD_DB_PASSWORD in .env}
    volumes:
      - guild-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U guild -d guild"]

  # Chat fan-out across Guild instances and single-use WebSocket ticket claims. Both are transient,
  # so this store keeps no volume; chat history is in PostgreSQL.
  guild-redis:
    <<: *redis
    command: ["redis-server", "--requirepass", "${GUILD_REDIS_PASSWORD:?set GUILD_REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${GUILD_REDIS_PASSWORD}

  guild:
    image: gabimiric/tamagotchi-guild:2.1.0
    restart: on-failure
    depends_on:
      guild-db:
        condition: service_healthy
      guild-redis:
        condition: service_healthy
    environment:
      <<: *gateway-context
      MAX_CONCURRENT_TASKS: 64
      MAX_WEBSOCKET_CONNECTIONS: 100
      DATABASE_URL: postgresql+psycopg://guild:${GUILD_DB_PASSWORD}@guild-db:5432/guild
      USER_MANAGEMENT_MODE: ${GUILD_USER_MANAGEMENT_MODE:-real}
      GATEWAY_URL: http://gateway:8080
      GATEWAY_JWKS_URL: http://gateway:8080/api/v1/gateway/.well-known/jwks.json
      CHAT_BROKER: redis
      REDIS_URL: redis://:${GUILD_REDIS_PASSWORD}@guild-redis:6379/0
    healthcheck:
      <<: *python-healthcheck
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8087/health')"]
    ports:
      - "8087:8087" # direct Guild Chat WebSocket

  # --- Monster Raid ----------------------------------------------------------------------------
  monster-raid-db:
    <<: *postgres
    environment:
      POSTGRES_DB: raid
      POSTGRES_USER: raid
      POSTGRES_PASSWORD: ${RAID_DB_PASSWORD:?set RAID_DB_PASSWORD in .env}
    volumes:
      - raid-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U raid -d raid"]

  monster-raid-redis:
    <<: *redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${RAID_REDIS_PASSWORD:?set RAID_REDIS_PASSWORD in .env}"]
    environment:
      REDISCLI_AUTH: ${RAID_REDIS_PASSWORD}
    volumes:
      - raid-redis-data:/data

  monster-raid:
    image: nickseen/tamagotchi-monster-raid:2.1.1 # its image declares the /healthz check
    restart: on-failure
    depends_on:
      monster-raid-db:
        condition: service_healthy
      monster-raid-redis:
        condition: service_healthy
    environment:
      <<: *gateway-context
      MAX_CONCURRENT_TASKS: 50
      MAX_WEBSOCKET_CONNECTIONS: 100
      RAID_ADDR: ":8088"
      RAID_STORAGE: postgres-redis
      DATABASE_URL: postgres://raid:${RAID_DB_PASSWORD}@monster-raid-db:5432/raid?sslmode=disable
      RAID_REDIS_ADDR: monster-raid-redis:6379
      RAID_REDIS_PASSWORD: ${RAID_REDIS_PASSWORD}
      RAID_REDIS_DB: 0
      RAID_DEPENDENCY_MODE: ${RAID_DEPENDENCY_MODE:-mock}
      RAID_MOCK_FAILURE: "false"
      GATEWAY_URL: http://gateway:8080
      GATEWAY_JWKS_URL: http://gateway:8080/api/v1/gateway/.well-known/jwks.json
    ports:
      - "8088:8088" # direct raid-feed WebSocket

volumes:
  usermgmt-data:
  tamagotchi-data:
  registry-data:
  battle-data:
  map-redis-data:
  notification-data:
  guild-data:
  raid-data:
  raid-redis-data:
