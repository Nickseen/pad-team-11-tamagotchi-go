      REDISCLI_AUTH: ${RAID_REDIS_PASSWORD}
    volumes:
      - raid-redis-data:/data

  monster-raid-1:
    <<: *monster-raid
    environment:
      <<: *monster-raid-env
      INSTANCE_BASE_URL: http://monster-raid-1:8088
      INSTANCE_GRPC_ADDRESS: monster-raid-1:9088
      INSTANCE_WS_PUBLIC_URL: ws://localhost:18088
    ports:
      - "18088:8088" # this replica's direct WebSocket origin

  monster-raid-2:
    <<: *monster-raid
    environment:
      <<: *monster-raid-env
      INSTANCE_BASE_URL: http://monster-raid-2:8088
      INSTANCE_GRPC_ADDRESS: monster-raid-2:9088
      INSTANCE_WS_PUBLIC_URL: ws://localhost:28088
    ports:
      - "28088:8088" # this replica's direct WebSocket origin

  monster-raid-3:
    <<: *monster-raid
    profiles: [scale-monster-raid, scale-all] # the optional third replica
    environment:
      <<: *monster-raid-env
      INSTANCE_BASE_URL: http://monster-raid-3:8088
      INSTANCE_GRPC_ADDRESS: monster-raid-3:9088
      INSTANCE_WS_PUBLIC_URL: ws://localhost:38088
    ports:
      - "38088:8088" # this replica's direct WebSocket origin

  # --- Data Warehouse and ETL (Lab 5 Grade 4, #194) ------------------------------------------------
  # An analytical PostgreSQL fed only from the services' own CSV exports (scripts/etl/extract.sh), never
  # by a domain service. The etl job applies warehouse/migrations and loads the exports, then exits:
  #   docker compose run --rm etl
  warehouse-db:
    <<: *postgres
    environment:
      POSTGRES_DB: warehouse
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD:?set WAREHOUSE_DB_PASSWORD in .env}
    volumes:
      - warehouse-data:/var/lib/postgresql/data
    healthcheck:
      <<: *postgres-healthcheck
      test: ["CMD-SHELL", "pg_isready -U warehouse -d warehouse"]

  etl:
    image: postgres:17-alpine # psql only; the job needs no image of its own
    profiles: [etl] # a job: not started by `up`, run on demand
    restart: "no"
    entrypoint: ["/bin/sh", "/etl/load.sh"]
    environment:
      PGHOST: warehouse-db
      PGUSER: warehouse
      PGDATABASE: warehouse
      PGOPTIONS: -c client_min_messages=warning
      PGPASSWORD: ${WAREHOUSE_DB_PASSWORD:?set WAREHOUSE_DB_PASSWORD in .env}
      ETL_REQUIRE_ALL: ${ETL_REQUIRE_ALL:-0}
      ETL_PAUSE_BEFORE_COMMIT: ${ETL_PAUSE_BEFORE_COMMIT:-0}
    volumes:
      - ./etl:/etl:ro
      - ./warehouse/migrations:/migrations:ro
      - ${ETL_INPUT_DIR:-./etl/input}:/input:ro
    depends_on:
      warehouse-db:
        condition: service_healthy

  # --- Monitoring (Lab 4 Grade 10, #154) -------------------------------------------------------------
  # Prometheus scrapes every /metrics; Alloy ships every container's JSON logs to Loki; Grafana shows
  # both. Only Grafana (and Prometheus, for ad-hoc queries) are published, on loopback.
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./monitoring/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    # Internal only: Grafana and the downloadable-logs endpoint (#155) read http://loki:3100.

  alloy:
    image: grafana/alloy:v1.5.1
    restart: unless-stopped
    depends_on:
      - loki
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "--storage.path=/var/lib/alloy/data",
              "/etc/alloy/config.alloy"]
    environment:
      # The Compose project whose containers are collected (the default is this folder's name).
      LOG_PROJECT: ${COMPOSE_PROJECT_NAME:-pad-team-11-tamagotchi-go}
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro # read-only: to discover containers and read their logs

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      # Anyone on this machine can look; only admin can change anything.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/broker.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"

secrets:
  jwt-signing-key:
    file: ./secrets/jwt-signing-key.pem # git-ignored; see the header for how to create it

