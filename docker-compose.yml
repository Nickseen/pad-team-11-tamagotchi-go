      condition: service_healthy

# The Gateway's shared cache (Lab 5, #195): Redis nodes the Gateway shards keys over by consistent hashing.
# In memory only (no RDB snapshots, no AOF): every entry is a copy the services can rebuild, so a restarted node
# starts empty. When a node is full it evicts the least recently used keys.
x-cache-node: &cache-node
  <<: *redis
  command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "64mb",
    "--maxmemory-policy", "allkeys-lru", "--requirepass", "${CACHE_PASSWORD:?set CACHE_PASSWORD in .env}"]
  environment:
    REDISCLI_AUTH: ${CACHE_PASSWORD}

x-postgres-node: &postgres-node
  <<: *postgres
  entrypoint: ["/bin/sh", "/ha/postgres-start.sh"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
    <<: *postgres-healthcheck

x-raid-db-env: &raid-db-env
