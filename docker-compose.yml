  notification-db-2:
    <<: *notification-standby
    hostname: notification-db-2
    volumes:
      - ./scripts/ha:/ha:ro
      - notification-db-2-data:/var/lib/postgresql/data

  # One block runs every Notification replica (deploy.replicas, the default 2 or
  # NOTIFICATION_REPLICAS). Each replica fills its own container name into {container}
  # (pad-team-11-tamagotchi-go-notification-<n>) before it registers (4.0.0, #177); the Discovery
  # allowlist admits up to five. Scale with `docker compose up -d --scale notification=3`.
  notification:
    <<: *notification
    deploy:
      replicas: ${NOTIFICATION_REPLICAS:-2}
    environment:
      <<: *notification-env
      INSTANCE_BASE_URL: "http://{container}:8086"

  # --- Guild ----------------------------------------------------------------------------------------
  guild-db:
    <<: *postgres-node
    hostname: guild-db
    environment:
      <<: *guild-db-env
      PGDATA: ${GUILD_POSTGRES_DATA_DIR:-/var/lib/postgresql/data}
      PG_REPLICA_SOURCE: ${GUILD_POSTGRES_UPSTREAM:-}
    volumes:
      - ./scripts/ha:/ha:ro
      - ${GUILD_POSTGRES_VOLUME:-guild-data}:/var/lib/postgresql/data

  guild-replication-init:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "/ha/postgres-init-role.sh"]
    environment:
      <<: *guild-db-env
      PGHOST: guild-db
      PGCONNECT_TIMEOUT: 3
    volumes:
      - ./scripts/ha:/ha:ro
    depends_on:
